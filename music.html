<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя музыка | Портфолио</title>
  <!-- Подключаем твой основной стиль со всеми переменными -->
  <link rel="stylesheet" href="css/style.css" />
  
  <style>
    /* Контейнер страницы */
    .music-page-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 20px; /* Увеличил верхний отступ, чтобы заголовок не прилипал к краю */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    /* Кнопка НАЗАД (теперь слева) */
    .back-btn-wrapper {
      align-self: flex-start; /* Прижимает блок к левому краю контейнера */
      margin-bottom: 40px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      background: var(--gradient-main);
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 30px rgba(138, 43, 239, 0.35);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
      overflow: hidden;
      border: none;
      cursor: pointer;
    }

    .back-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.1);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .back-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 16px 40px rgba(138, 43, 239, 0.55);
    }

    .back-btn:hover::before {
      opacity: 1;
    }

    .back-icon {
      margin-right: 10px;
      font-size: 1.1rem;
      display: inline-block;
      transform: rotate(180deg); 
    }

    h1.music-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      text-transform: uppercase;
      letter-spacing: 6px;
      margin-bottom: 16px;
      background: var(--gradient-main);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(138, 43, 239, 0.4);
      width: 100%;
      text-align: center;
    }

    .music-subtitle {
      color: var(--text-gray);
      font-family: 'Manrope', sans-serif;
      font-size: 1.1rem;
      max-width: 600px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="music-page-wrapper">
    
    <!-- Кнопка НАЗАД (теперь слева) -->
    <div class="back-btn-wrapper">
      <a href="index.html" class="back-btn">
        <span class="back-icon">◀</span> На главную
      </a>
    </div>

    <h1 class="music-title">Мои треки</h1>
    <p class="music-subtitle">Послушай мои композиции. Здесь скоро появится полный список релизов.</p>

  </div>

  <footer>
    <div class="footer-line"></div>
    <p>&copy; 2026 Моё портфолио</p>
  </footer>
</body>
</html>
